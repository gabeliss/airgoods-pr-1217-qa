name: Materialize QA media
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hex chunks and assemble JPEGs
        env:
          CHUNKS_TGZ_URL: "https://airgoods-bucket.s3.amazonaws.com/pr-1217-qa-media/chunks-orig.tgz"
        run: |
          set -euo pipefail
          mkdir -p images chunks
          curl -fsSL "$CHUNKS_TGZ_URL" -o /tmp/chunks.tgz
          # clear any partial/corrupt remote chunks first
          rm -rf chunks/*
          tar -xzf /tmp/chunks.tgz -C chunks
          python3 - <<'PY'
          from pathlib import Path
          chunks = Path('chunks')
          for folder in sorted(p for p in chunks.iterdir() if p.is_dir()):
              parts = sorted(folder.glob('part_*.hex'))
              if not parts:
                  continue
              hexdata = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              if len(hexdata) < 1000 or len(hexdata) % 2:
                  print(f'skip {folder.name}: bad hex len={len(hexdata)}')
                  continue
              data = bytes.fromhex(hexdata)
              if data[:3] != b'\xff\xd8\xff':
                  print(f'skip {folder.name}: not jpeg')
                  continue
              out = Path('images') / f'{folder.name}.jpg'
              out.write_bytes(data)
              print(f'wrote {out} ({len(data)} bytes from {len(parts)} parts)')
          PY
          echo "hex parts:" $(ls chunks/*/*.hex | wc -l)
          ls -lh images/*.jpg
          file images/*.jpg
      - name: Commit chunks and materialized media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chunks images/*.jpg
          git rm -f --ignore-unmatch images/.upload-probe.txt images/.upload-probe*.txt images/.pending-swap*.txt images/.args-include-probe.txt images/.fidelity-*.hex images/.file-uri-probe.txt images/.upload-probe-*.txt images/rodeo_product_details.jpg.b64 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Materialize QA media from hex chunks for PR #1217"
          git push
