name: Materialize QA media
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble hex parts into JPEGs
        run: |
          set -euo pipefail
          mkdir -p images
          python3 - <<'PY'
          from pathlib import Path
          for d in sorted(Path('chunks').glob('*/')):
              name=d.name
              hx=''.join(p.read_text().strip() for p in sorted(d.glob('part_*.hex')))
              out=Path('images')/f'{name}.jpg'
              out.write_bytes(bytes.fromhex(hx))
              print(name, out.stat().st_size)
          PY
          file images/*.jpg || true
          ls -lh images/
      - name: Commit images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Materialize QA JPEGs for PR #1217"
          git push
