name: Materialize QA media
on:
  push:
    paths:
      - 'images/**.b64'
      - '.github/workflows/materialize-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 media
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in images/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
          ls -lh images/
      - name: Commit decoded media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "Materialize QA screenshots and walkthrough for PR #1217"
          git push
