name: Materialize QA media
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download b64 sources, assemble parts, and decode media
        run: |
          set -euo pipefail
          mkdir -p images
          BASE="https://airgoods-bucket-user-uploads.s3.amazonaws.com/pr-1217-qa-media"
          FILES=(
            helo_ingredients_empty_state.jpg.b64
            onions_certifications.jpg.b64
            onions_ingredients_freetext.jpg.b64
            onions_overview_hero.jpg.b64
            rodeo_ingredients_structured.jpg.b64
            rodeo_nutritional_information.jpg.b64
            rodeo_overview_hero.jpg.b64
            rodeo_product_details.jpg.b64
            pdp_buyer_walkthrough_air8122.mp4.b64
          )
          for f in "${FILES[@]}"; do
            echo "Downloading $f"
            curl -fsSL "$BASE/$f" -o "images/$f"
            wc -c "images/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts_root = Path('images/_parts')
          if parts_root.exists():
              groups = {}
              for p in sorted(parts_root.glob('*.part*')):
                  name = p.name.rsplit('.part', 1)[0]
                  groups.setdefault(name, []).append(p)
              for name, files in sorted(groups.items()):
                  files = sorted(files, key=lambda x: x.name)
                  content = ''.join(f.read_text(encoding='utf-8') for f in files)
                  out = Path('images') / name
                  if not out.exists() or out.stat().st_size < 100:
                      out.write_text(content, encoding='utf-8')
                      print(f'assembled {out} ({len(content)} chars from {len(files)} parts)')
          for b64 in sorted(Path('images').glob('*.b64')):
              raw = b64.read_text(encoding='utf-8').strip()
              if len(raw) < 100:
                  print(f'skip tiny {b64.name} ({len(raw)} chars)')
                  continue
              data = base64.b64decode(raw)
              out = Path(str(b64)[:-4])
              out.write_bytes(data)
              print(f'decoded {b64.name} -> {out.name} ({len(data)} bytes)')
          PY
          ls -lh images/ || true
          file images/* || true
      - name: Commit materialized media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.b64 images/*.jpg images/*.mp4 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Materialize QA media from base64 for PR #1217"
          git push
