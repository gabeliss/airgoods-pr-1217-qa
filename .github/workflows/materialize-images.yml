name: Materialize QA media
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble hex chunks into JPEGs
        run: |
          set -euo pipefail
          mkdir -p images
          python3 - <<'PY'
          from pathlib import Path
          chunks = Path('chunks')
          if chunks.exists():
              for folder in sorted(p for p in chunks.iterdir() if p.is_dir()):
                  parts = sorted(folder.glob('part_*.hex'))
                  if not parts:
                      continue
                  hexdata = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
                  if len(hexdata) < 1000 or len(hexdata) % 2:
                      print(f'skip {folder.name}: bad hex len={len(hexdata)}')
                      continue
                  try:
                      data = bytes.fromhex(hexdata)
                  except ValueError as e:
                      print(f'skip {folder.name}: {e}')
                      continue
                  if data[:3] != b'\xff\xd8\xff':
                      print(f'skip {folder.name}: not jpeg ({data[:8]!r})')
                      continue
                  out = Path('images') / f'{folder.name}.jpg'
                  out.write_bytes(data)
                  print(f'wrote {out} ({len(data)} bytes from {len(parts)} parts)')
          PY
          ls -lh images/*.jpg 2>/dev/null || true
          file images/*.jpg 2>/dev/null || true
      - name: Commit materialized media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Materialize QA media from hex chunks for PR #1217"
          git push
